name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: backend
env:
  # 与 backend/uv.lock 一致，评测检查无需安装整套 GPU 依赖。
  CI_NUMPY_REQUIREMENT: numpy==2.5.4
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv pip install --no-deps "$CI_NUMPY_REQUIREMENT"
      - run: uv run --locked --no-sync poe check
      - run: uv run --locked --no-sync --offline python -m scripts.copilot_regression
      - run: uv run --locked python -m pytest
        working-directory: mock_core
  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: grounded
          POSTGRES_PASSWORD: grounded
          POSTGRES_DB: grounded_rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grounded -d grounded_rag"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv pip install --no-deps "$CI_NUMPY_REQUIREMENT"
      - run: docker compose up -d --build --wait es redis mock_core
        working-directory: .
        env:
          MOCK_ALLOW_FAULT_HEADERS: "true"
      - run: uv run --locked --no-sync poe test-int
