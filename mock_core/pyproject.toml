[project]
name = "grounded-rag-mock-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiomysql==0.3.2",
    "fastapi==0.143.2",
    "pymysql[rsa]>=1.1.2,<2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "anyio>=4,<5",
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
