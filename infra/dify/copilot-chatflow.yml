            variable_selector:
            - start
            - channel
            comparison_operator: is
            value: agent
            varType: string
      position:
        x: 710
        y: 620
      positionAbsolute:
        x: 710
        y: 620
      sourcePosition: right
      targetPosition: left
      selected: false
      width: 244
    - id: plan_tools
      type: custom
      data:
        title: 规划五个只读工具
        desc: small 网关档。代码节点会校验模型给出的工具和参数。
        type: llm
        selected: false
        model:
          provider: langgenius/openai_api_compatible/openai_api_compatible
          name: small
          mode: chat
          completion_params:
            temperature: 0
            max_tokens: 400
        context:
          enabled: false
          variable_selector: []
        prompt_template:
        - id: plan_tools-system
          role: system
          text: |
            住宅ローンの個別照会に必要なツールだけを選ぶ。次のツール名を使い、出力は {"calls":[{...}]} 形式の JSON オブジェクト一つにする。
            - query_loan_contracts: 本人の住宅ローン契約の一覧、借入時の元金、実行日、商品、契約状態。
            - query_repayment_schedule: 次回返済日、次回額、残元金、残回数、返済予定表。契約番号は contract_id に入れる。開始／終了の返済回を利用者が明示した場合だけ start_period／end_period に整数を入れる。
            - query_delinquency: 延滞、支払遅れ、延滞日数、延滞額、遅延損害金。
            - query_rate_terms: 本人の契約に適用される金利、変動・固定の別、固定期限、団信、上乗せ金利。契約番号は contract_id に入れる。
            - query_benefits: 本人に適用されている優遇やキャンペーン。
            各要素のキー tool_name は必須。契約番号は照会文に書かれた L から始まる番号だけを使う。記載がなければ、選んだ対象ツールの contract_id を省略する。推測で補わない。顧客・担当者の識別子を出力しない。
            通常は質問の主題に合う一件。異なる照会が明示された場合はそれぞれを選び、合計を五件以内にする。一般制度や手順はこのツール計画に含めない。
            例：「契約番号L0001の次回返済額を教えて」→ {"calls":[{"tool_name":"query_repayment_schedule","contract_id":"L0001"}]}
            例：「今の延滞額と適用中の優遇を調べて」→ {"calls":[{"tool_name":"query_delinquency"},{"tool_name":"query_benefits"}]}
        - id: plan_tools-user
          role: user
          text: '{{#sys.query#}}'
        vision:
          enabled: false
        variables: []
        error_strategy: fail-branch
      position:
        x: 1020
        y: 620
      positionAbsolute:
        x: 1020
        y: 620
      sourcePosition: right
      targetPosition: left
      selected: false
      width: 244
    - id: prepare_tools
      type: custom
      data:
        title: 校验工具参数
        desc: 固定工具名、上下文和合同位置。无合同编号时提示补充。
        type: code
        selected: false
        code_language: python3
        code: |
          import json
          import re
          import unicodedata

          TOOLS = {
              "query_loan_contracts",
              "query_repayment_schedule",
              "query_delinquency",
              "query_rate_terms",
              "query_benefits",
          }
          CONTRACT_TOOLS = {"query_repayment_schedule", "query_rate_terms"}
          ID_FORMAT = re.compile(r"[A-Za-z0-9_-]{1,16}")
          CONTRACT_FORMAT = re.compile(r"(?<![A-Za-z0-9_])L[0-9]{1,15}(?![A-Za-z0-9_])")
          INVALID = {"status": "invalid", "calls": []}
          MISSING_CONTRACT = {"status": "missing_contract", "calls": []}


          def main(plan, agent_id, customer_id, mock_fault, query):
              agent_id = (agent_id or "").strip()
              customer_id = (customer_id or "").strip()
              mock_fault = mock_fault or ""
              if not (ID_FORMAT.fullmatch(agent_id) and ID_FORMAT.fullmatch(customer_id)):
                  return INVALID
              if mock_fault not in {"", "timeout", "5xx", "delay"}:
                  return INVALID

              plan = (plan or "").strip()
              match = re.fullmatch(r"```(?:json)?\s*(.*?)\s*```", plan, re.DOTALL | re.IGNORECASE)
              if match:
                  plan = match.group(1)
              try:
                  parsed = json.loads(plan)
              except (ValueError, RecursionError):
                  return INVALID
              calls = parsed.get("calls") if isinstance(parsed, dict) else None
              if not isinstance(calls, list) or not 1 <= len(calls) <= 5:
                  return INVALID

              contracts_in_query = set(CONTRACT_FORMAT.findall(unicodedata.normalize("NFKC", query).upper()))
              checked = []
              for call in calls:
                  if not isinstance(call, dict):
                      return INVALID
                  tool_name = call.get("tool_name")
                  if not isinstance(tool_name, str) or tool_name not in TOOLS:
                      return INVALID
                  arguments = {}
                  if tool_name in CONTRACT_TOOLS:
                      contract_id = call.get("contract_id")
                      if isinstance(contract_id, str):
                          contract_id = unicodedata.normalize("NFKC", contract_id).strip().upper()
                      if not contract_id:
                          if len(contracts_in_query) != 1:
                              return MISSING_CONTRACT
                          contract_id = next(iter(contracts_in_query))
                      if not isinstance(contract_id, str) or contract_id not in contracts_in_query:
                          return INVALID
                      arguments["contract_id"] = contract_id
                  if tool_name == "query_repayment_schedule":
                      for key in ("start_period", "end_period"):
                          period = call.get(key)
                          if period is not None:
                              if type(period) is not int or not 1 <= period <= 1_000_000_000:
                                  return INVALID
                              arguments[key] = period
                      if arguments.get("start_period", 1) > arguments.get("end_period", 1_000_000_000):
                          return INVALID
                  item = {
                      "tool_name": tool_name, "arguments": arguments,
                      "agent_id": agent_id, "customer_id": customer_id, "mock_fault": mock_fault,
                  }
                  if item not in checked:
                      checked.append(item)
              return {"status": "ok", "calls": checked}
        variables:
        - variable: plan
          value_selector:
          - plan_tools
          - text
        - variable: agent_id
          value_selector:
          - start
          - agent_id
        - variable: customer_id
