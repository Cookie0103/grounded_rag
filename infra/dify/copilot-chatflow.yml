    - id: check_authorization
      type: custom
      data:
        title: 读取鉴权结果
        desc: 仅接受 HTTP 200 且 authorized 为 JSON 布尔真。
        type: code
        selected: false
        code_language: python3
        code: |
          import json
          import re


          def main(status_code, body, error_message=None):
              # Dify 的默认值分支会覆盖非 2xx 的 status_code，并保留错误文本。
              if status_code == 0:
                  match = re.fullmatch(r"Request failed with status code ([45][0-9]{2})", error_message or "")
                  if match:
                      status_code = int(match.group(1))
              if status_code in (401, 403):
                  return {"status": "denied", "reason": "not_authorized"}
              if status_code != 200:
                  return {"status": "failed", "reason": "authorization_unavailable"}
              try:
                  payload = json.loads(body)
              except (TypeError, ValueError, RecursionError):
                  payload = None
              authorized = payload.get("authorized") if isinstance(payload, dict) else None
              if authorized is True:
                  return {"status": "ok", "reason": ""}
              if authorized is False:
                  return {"status": "denied", "reason": "not_authorized"}
              return {"status": "failed", "reason": "invalid_response"}
        variables:
