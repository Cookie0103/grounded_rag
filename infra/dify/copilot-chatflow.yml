    - id: crop_response
      type: custom
      data:
        title: 白名单与列表裁剪
        desc: 仅使用合成载荷。列表最多五条，保留总数。
        type: code
        selected: false
        code_language: python3
        code: |
          import json
          import re

          NULL = type(None)
          SUMMARY = {
              "query_repayment_schedule": {
                  "next_payment_date": (str, NULL), "next_payment_yen": (int, NULL),
                  "outstanding_principal_yen": (int,), "remaining_installments": (int,),
              },
              "query_delinquency": {"days_overdue": (int,), "amount_yen": (int,), "late_fee_yen": (int,)},
              "query_rate_terms": {
                  "annual_rate_percent": (int, float), "rate_type": (str,), "fixed_until": (str, NULL),
                  "insurance_type": (str,), "insurance_increment_percent": (int, float),
              },
          }
          LISTS = {
              "query_loan_contracts": ("contracts", {
                  "contract_id": (str,), "product": (str,), "principal_yen": (int,),
                  "disbursed_on": (str,), "status": (str,),
              }),
              "query_repayment_schedule": ("schedule", {
                  "period": (int,), "due_date": (str,), "amount_yen": (int,),
                  "principal_yen": (int,), "interest_yen": (int,),
              }),
              "query_benefits": ("benefits", {"name": (str,), "status": (str,)}),
          }


          def project(source, fields):
              if not isinstance(source, dict):
                  raise ValueError("invalid response")
              result = {}
              for key, allowed in fields.items():
                  if key not in source or type(source[key]) not in allowed:
                      raise ValueError("invalid response")
                  result[key] = source[key]
              return result


          def main(item, status_code, body, error_message=None):
              # Dify 的默认值分支会覆盖非 2xx 的 status_code，并保留错误文本。
              if status_code == 0:
                  match = re.fullmatch(r"Request failed with status code ([45][0-9]{2})", error_message or "")
                  if match:
                      status_code = int(match.group(1))
              tool = item["tool_name"]
              arguments = item["arguments"]
              result = {
                  "tool_name": tool,
                  "arguments": {
                      "has_contract_id": "contract_id" in arguments,
                      "start_period": arguments.get("start_period"),
                      "end_period": arguments.get("end_period"),
                  },
                  "status": "failed", "reason": "upstream_error", "business_dispatched": True,
                  "data": None, "total": None, "returned_count": None,
              }
              if status_code in (401, 403):
                  result.update(status="denied", reason="not_authorized")
              elif status_code == 504:
                  result["reason"] = "timeout"
              elif status_code == 0:
                  result["reason"] = "transport_error"
              if status_code != 200:
                  return {"result": result}

              try:
                  payload = json.loads(body)
                  if not isinstance(payload, dict) or payload.get("synthetic") is not True:
                      raise ValueError("invalid response")
                  source = payload["data"]
                  data = project(source, SUMMARY.get(tool, {}))
                  total = payload.get("total")
                  if total is not None and (type(total) is not int or total < 0):
                      raise ValueError("invalid response")
                  returned_count = None
                  if tool in LISTS:
                      key, fields = LISTS[tool]
                      rows = source[key]
                      if not isinstance(rows, list):
                          raise ValueError("invalid response")
                      total = max(total or 0, len(rows))
                      projected = [project(row, fields) for row in rows]
                      if key == "schedule" and not {"start_period", "end_period"}.intersection(arguments):
                          date = data["next_payment_date"]
                          projected = [row for row in projected if row["due_date"] >= date] if date else projected[-5:]
                      data[key] = projected[:5]
                      returned_count = len(data[key])
                  result.update(status="ok", reason=None, synthetic=True, data=data, total=total, returned_count=returned_count)
              except (KeyError, TypeError, ValueError, RecursionError):
                  result["reason"] = "invalid_response"
              return {"result": result}
        variables:
        - variable: item
          value_selector:
          - run_tools
          - item
        - variable: body
          value_selector:
          - mock_get
          - body
        - variable: status_code
          value_selector:
          - mock_get
          - status_code
        - variable: error_message
          value_selector:
          - mock_get
          - error_message
        outputs:
          result:
            type: object
            children: null
        isInIteration: true
        isInLoop: false
        iteration_id: run_tools
