          value_selector:
          - mock_authorize
          - body
        - variable: status_code
          value_selector:
          - mock_authorize
          - status_code
        - variable: error_message
          value_selector:
          - mock_authorize
          - error_message
        outputs:
          status:
            type: string
            children: null
          reason:
            type: string
            children: null
        isInIteration: true
        isInLoop: false
        iteration_id: run_tools
